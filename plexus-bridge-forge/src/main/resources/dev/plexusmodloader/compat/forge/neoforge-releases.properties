# The NeoForge release Plexus Mod Loader runs NeoForge mods with, per Minecraft version (ADR-0026):
#   <minecraft version>=<neoforge version> <SHA-1 of neoforge-<neoforge version>-installer.jar>
# The installer comes from https://maven.neoforged.net/releases/ and is checked against this SHA-1; everything else
# (libraries, binary patches) is checked against the SHA-1s inside that installer.
# NeoForge builds each hotfix separately. 26.1 and 26.1.1 have beta builds only; Plexus Mod Loader runs the last one of
# each, as NeoForge's installer offers no other for those versions (ADR-0026, NEOFORGE_FULL_SUPPORT.md N10).
