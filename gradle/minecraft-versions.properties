# Minecraft versions this Poly Mod Loader build supports (ADR-0011).
#
# Every supported version has two modules, included by settings.gradle.kts:
#   poly-version-adapter-v<id>  launch targets and transformation rules
#   poly-game-v<id>             the Native API implemented with that version's game classes
# where <id> is the version with '.' and '-' replaced by '_' (26.2 -> 26_2).
#
# Add a version by copying the closest one, then fix what no longer compiles or passes:
#   ./gradlew newMinecraftVersion -Pfrom=26.2 -Pto=<new version> [-Pjava=<feature version>]

# Comma-separated, oldest first.
supported=26.1,26.2

# Versions with modules that are NOT supported (ADR-0019): the build compiles and tests their modules and
# -PpolyMinecraft can pick them for development runs, but the installer, the SDK and the website leave them
# out. Versions before 26.1 run on the game jar remapped to Mojang names (remapMinecraft). Add one with
# newMinecraftVersion -Pexperimental=true.
experimental=1.21.11

# The version that examples, runClient/runServer and the verification tasks use. Pick another one
# for a single build with -PpolyMinecraft=<version>.
default=26.2

# The Java feature version each Minecraft version runs on; its modules are compiled with it.
java.26.1=25
java.26.2=25
java.26.3=25
java.1.21.11=25

# Hotfixes that run on another version's modules, comma-separated, oldest first: hotfixes.<version>=<ids>.
# Only for hotfixes whose transformation targets and the game members the game layer uses did not change;
# that version's adapter lists them in GameVersionAdapter.gameVersions() (ADR-0011 point 4). They can be
# picked with -PpolyMinecraft and are offered by the installer, but have no modules of their own.
hotfixes.26.1=26.1.1,26.1.2
