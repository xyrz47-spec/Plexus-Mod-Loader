# Runs the same checks as before a local commit (AGENTS.md).
# Window-opening tests (clientWorldReloadTest, launcherProfileTest, frameBenchmark) are not run here.
name: ci
# Only main and pull requests: a private repository has a monthly Actions minute limit, and Windows
# runners count double.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
      # Minecraft files are downloaded from Mojang and checked by hash; keep them between runs.
      - uses: actions/cache@v6
        with:
          path: ~/.gradle/caches/poly-minecraft
          key: poly-minecraft-${{ hashFiles('gradle/minecraft-versions.properties') }}
      - run: ./gradlew.bat check
      - run: ./gradlew.bat -p build-logic check
      - run: ./gradlew.bat :poly-bootstrap:serverBootSmokeTest :poly-bootstrap:worldCreateSaveTest :poly-bootstrap:nativeApiGameTests :poly-bootstrap:compatibilityMatrix
      - run: ./gradlew.bat :poly-installer:installerDistributions
      # The website source (site/) is not in the public repository.
      - uses: actions/setup-node@v7
        if: hashFiles('site/package.json') != ''
        with:
          node-version: "24"
      - name: Build the documentation site
        if: hashFiles('site/package.json') != ''
        working-directory: site
        env:
          POLY_DOCS_URL: https://example.invalid
        run: |
          npm ci
          npm run build
