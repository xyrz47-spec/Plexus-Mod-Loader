# Publishes a release when a version tag is pushed:
#   git tag v0.1.0-alpha.10 && git push origin v0.1.0-alpha.10
# The tag must match poly.version in gradle.properties, and CHANGELOG.md must have a "## <version>" section.
# Attaches PolyModLoader-<version>.jar, PolyModLoader-<version>.exe and SHA256SUMS.txt. Versions with a "-" (alpha,
# beta, rc) are marked as pre-releases.
#
# The source can stay in a private repository while releases go to a public one: set the variable
# POLY_RELEASE_REPO (owner/name, such as xyrz47-spec/Poly-Mod-Loader) and the secret POLY_RELEASE_TOKEN (a
# fine-grained token with "Contents: read and write" on that repository only). Without them the release is
# created in this repository.
name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the previous release tag, for the change check
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
      - uses: actions/cache@v6
        with:
          path: ~/.gradle/caches/poly-minecraft
          key: poly-minecraft-${{ hashFiles('gradle/minecraft-versions.properties') }}
      - name: Check the tag against gradle.properties
        shell: bash
        run: |
          version=$(sed -n 's/^poly.version=//p' gradle.properties | tr -d '\r')
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match poly.version=$version" >&2
            exit 1
          fi
          echo "POLY_VERSION=$version" >> "$GITHUB_ENV"
          # Every version the installer offers: the supported ones and their hotfixes (hotfixes.<version>=...).
          minecraft=$(sed -n 's/^supported=//p; s/^hotfixes\.[^=]*=//p' gradle/minecraft-versions.properties \
            | tr -d '\r' | tr ',' '\n' | grep . | sort -t. -k1,1n -k2,2n -k3,3n | paste -sd, - | sed 's/,/, /g')
          echo "POLY_MINECRAFT_VERSIONS=$minecraft" >> "$GITHUB_ENV"
      - name: Check that the build changed since the previous release
        shell: bash
        run: python .github/scripts/check-release-changes.py "$POLY_VERSION"
      - name: Release notes from CHANGELOG.md
        shell: bash
        env:
          POLY_RELEASE_REPO: ${{ vars.POLY_RELEASE_REPO }}
        run: python .github/scripts/release-notes.py "$POLY_VERSION" CHANGELOG.md > release-notes.md
      - name: Verify
        run: |
          ./gradlew.bat check
          ./gradlew.bat :poly-bootstrap:worldCreateSaveTest :poly-bootstrap:nativeApiGameTests :poly-bootstrap:compatibilityMatrix
      - name: Build the installer (.jar and .exe; Rust is preinstalled on GitHub's Windows runners)
        run: ./gradlew.bat :poly-installer:installerDistributions
      - name: Publish
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.POLY_RELEASE_TOKEN || github.token }}
          RELEASE_REPO: ${{ vars.POLY_RELEASE_REPO || github.repository }}
        run: |
          cd poly-installer/build/distributions
          sha256sum "PolyModLoader-$POLY_VERSION.jar" "PolyModLoader-$POLY_VERSION.exe" > SHA256SUMS.txt
          prerelease=""
          case "$POLY_VERSION" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" \
            "PolyModLoader-$POLY_VERSION.jar" "PolyModLoader-$POLY_VERSION.exe" SHA256SUMS.txt \
            --repo "$RELEASE_REPO" --title "Poly Mod Loader $POLY_VERSION" \
            --notes-file "$GITHUB_WORKSPACE/release-notes.md" $prerelease
