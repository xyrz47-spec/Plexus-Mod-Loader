modLoader = "javafml"
loaderVersion = "[1,)"
license = "MIT"

[[mods]]
modId = "neoforge_mixin"
version = "1.0.0"
displayName = "NeoForge Mixin"
description = "Poly Mod Loader test mod: Mixin injections into real game classes from a NeoForge mod."

[[mixins]]
config = "neoforge_mixin.mixins.json"

# FML applies this configuration only when the mod it requires is present; it is not, and the jar has no such file.
[[mixins]]
config = "neoforge_mixin.absent.mixins.json"
requiredMods = ["not_installed_mod"]

[[dependencies.neoforge_mixin]]
modId = "neoforge"
type = "required"
versionRange = "[26.1,)"
ordering = "NONE"
side = "BOTH"
